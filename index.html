<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>삼국시대 — 고구려·백제·신라</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1410">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div id="app">

    <!-- ===== Start screen ===== -->
    <section id="start-screen">
      <div class="start-inner">
        <h1 class="title">三國志<span>삼국지</span></h1>
        <div class="scenario-pick"><label>시대 <select id="era-select" class="auto-speed"></select></label></div>
        <div class="scenario-pick"><label>시나리오 <select id="scenario-select" class="auto-speed"></select></label></div>
        <p class="scenario-title" id="scenario-title"></p>
        <p class="scenario-intro" id="scenario-intro"></p>
        <div class="start-actions">
          <button id="btn-continue" class="btn btn-gold" hidden>저장된 게임 이어하기</button>
          <button id="btn-observe" class="btn btn-observe">👁 관전 모드 (모든 세력을 AI가 운영)</button>
          <label class="opt">난이도 <select id="opt-difficulty" class="auto-speed"><option value="easy">쉬움 · 내 수입 +20%, AI 공격 소극적</option><option value="normal" selected>보통</option><option value="hard">어려움 · AI 수입 +20%, 더 대담하고 사신에 냉담</option></select></label>
          <label class="opt"><input type="checkbox" id="opt-hist-deaths" checked> 역사적 사망 재현 <span class="opt-hint">(장수가 역사대로 수명을 다하면 사망)</span></label>
        </div>
        <h2 class="choose">세력을 고르시오</h2>
        <div id="faction-grid" class="faction-grid"></div>
      </div>
    </section>

    <!-- ===== Game screen ===== -->
    <section id="game-screen" hidden>
      <header id="topbar">
        <div class="tb-left">
          <span id="tb-faction" class="tb-faction"></span>
          <span id="tb-date" class="tb-date"></span>
        </div>
        <div class="tb-stats" id="tb-stats"></div>
        <div class="tb-actions">
          <span id="tb-badges" class="tb-badges"></span>
          <button class="btn tab" id="btn-overview" title="영토 (R)">영토</button>
          <button class="btn tab" id="btn-officers" title="천하의 장수 (F)">장수</button>
          <button class="btn tab" id="btn-diplomacy" title="외교 (D)">외교</button>
          <button class="btn tab" id="btn-objectives" title="목표와 야망 (O)">목표</button>
          <span id="auto-ctl" class="auto-ctl" hidden>
            <select id="auto-speed" class="auto-speed" title="자동 진행 속도">
              <option value="3000">아주 느림 · 3초</option>
              <option value="1500">느림 · 1.5초</option>
              <option value="600" selected>보통 · 0.6초</option>
              <option value="200">빠름 · 0.2초</option>
            </select>
            <select id="watch-mode" class="auto-speed" title="공성전: 지도에서 직접 관전할지, 보고로 제안받을지, 모두 생략할지">
              <option value="ask" selected>전투: 재연 제안</option>
              <option value="all">전투: 모두 관전</option>
              <option value="skip">전투: 모두 생략</option>
            </select>
            <label id="auto-pause-wrap" class="auto-pause" title="큰 사건이 일어나면 자동 진행을 멈추고 알림"><input type="checkbox" id="auto-pause" checked> 사건 시 정지</label>
            <button class="btn" id="btn-auto">▶▶ 자동</button>
          </span>
          <button class="btn btn-gold" id="btn-endturn">월 넘기기 ▶</button>
          <button class="btn" id="btn-more" title="통계 · 사전 · 도움말 · 저장 · 메뉴">≡</button>
          <div id="more-menu" class="dropdown" hidden>
            <button id="btn-stats">통계 <kbd>S</kbd></button>
            <button id="btn-wiki">사전 <kbd>L</kbd></button>
            <button id="btn-help">도움말 <kbd>?</kbd></button>
            <button id="btn-legend">범례</button>
            <button id="btn-hexmaps" title="도시마다의 13 x 12 헥스 전장">전투맵</button>
            <button id="btn-cinema">화면 숨기기 <kbd>H</kbd></button>
            <button id="btn-save">저장</button>
            <button id="btn-menu">메인 메뉴 <kbd>M</kbd></button>
          </div>
        </div>
      </header>

      <main id="main">
        <div id="map-wrap">
          <svg id="map" viewBox="0 0 1400 1180" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="zoom-ov">
            <button id="zoom-in" title="확대">+</button>
            <button id="zoom-out" title="축소">−</button>
            <button id="zoom-reset" title="지도 맞춤 (Home)">⤢</button>
            <button id="toggle-territory" title="세력권 음영 (끔)">◧</button>
            <button id="toggle-legend" title="세력 범례">▤</button>
          </div>
          <div id="legend" class="legend-ov" hidden></div>
          <div id="tip" class="tip" hidden></div>
          <aside id="side" class="drawer">
            <button id="drawer-close" class="drawer-close" title="패널 닫기 (Esc)">×</button>
            <div id="panel"></div>
          </aside>
          <button id="drawer-handle" class="drawer-handle" title="패널 열기">◂</button>
          <div id="ticker" class="ticker" title="연대기 열기"><span class="lt" id="ticker-time"></span><span id="ticker-text"></span><span id="ticker-more" class="ticker-more"></span></div>
          <div id="chronicle" class="chronicle" hidden>
            <div class="log-title">연대기 <button id="chron-close" class="btn-sm">닫기</button></div>
            <div id="log"></div>
          </div>
          <button id="cinema-exit" class="cinema-exit" title="화면 보이기 (H)">▤</button>
        </div>
      </main>
    </section>

    <!-- ===== Battle screen ===== -->
    <section id="battle-screen" hidden>
      <div class="bt-head">
        <h2 id="bt-title"></h2>
        <span id="bt-day" class="bt-day"></span>
        <span id="bt-food" class="bt-food"></span>
        <span style="margin-left:auto"></span>
        <button class="btn" id="bt-logtoggle" title="전투 기록 보이기/숨기기">☰ 기록</button>
        <button class="btn" id="bt-help" title="전투 방법">?</button>
        <button class="btn" id="bt-close">지도로 돌아가기</button>
      </div>
      <div class="bt-main">
        <div class="bt-map"><svg id="bt-map"></svg></div>
        <aside class="bt-side">
          <div id="bt-sides"></div>
          <div id="bt-unit" class="bt-unit"></div>
          <div class="bt-actions" id="bt-actions"></div>
          <div class="log-title">전투 기록</div>
          <div id="bt-log" class="bt-log"></div>
        </aside>
      </div>
    </section>

    <!-- ===== Modal ===== -->
    <div id="modal" hidden>
      <div class="modal-box" id="modal-box"></div>
    </div>
  </div>

  <script src="js/eras.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/hexview.js"></script>
  <script src="js/game.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/ui.js"></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
